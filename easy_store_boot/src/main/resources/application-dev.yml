server:
  port: 8080
  tomcat:
    max-swallow-size: -1
    max-connections: 80
    accept-count: 20
    basedir: temp
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*

spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  mvc:
    static-path-pattern: /**
  resource:
    static-locations: classpath:/static/,classpath:/public/
  datasource:
    #引用项目中的数据库文件
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:db/easy_store.db?busy_timeout=10000
    username:
    password:
    hikari:
      maximum-pool-size: 1
      connection-timeout: 10000
      connection-init-sql: PRAGMA busy_timeout=10000
    # 指定静态资源的路径
    web:
      resources:
        static-locations: classpath:/static/


#mybatis plus 设置
mybatis-plus:
  mapper-locations: classpath*:org/jeecgframework/boot/easy_store_boot/app/modules/**/xml/*Mapper.xml
  global-config:
    # 关闭MP3.0自带的banner
    banner: false
    db-config:
      # 默认数据库表下划线命名
      table-underline: true
  configuration:
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 返回类型为Map,显示null对应的字段
    call-setters-on-nulls: true

es-app :
  # 本地：local\Minio：minio\阿里云：alioss
  uploadType: local
  path :
    #文件上传根目录 设置
    upload: D://opt//upFiles
    #webapp文件路径
    webapp: D://opt//webapp
